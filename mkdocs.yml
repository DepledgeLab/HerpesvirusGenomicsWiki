site_name: Herpesvirus Genomics Wiki
site_description: Herpesvirus Genomics Wiki
site_url: https://depledgelab.github.io/HerpesvirusGenomicsWiki/

theme:
  name: material

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - toc.follow

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.caret
  - pymdownx.tilde
  - attr_list

plugins:
  - search

nav:
  - Home: index.md

  - About: 
      - about/index.md

  - Viral genome analyses & comparisons:
      - dna/index.md

  - Gene regulation - from transcriptomes to chromatin:
      - rna/index.md
      - Nanopore Direct RNA Sequencing (DRS): 
        - rna/nanopore-drs/index.md        
        - Multiplexing approaches: rna/nanopore-drs/multiplexing.md
        - Poly(A) tail analyses: rna/nanopore-drs/poly-a-tails.md
        - RNA modification detection: rna/nanopore-drs/rna-modifications.md
        - Additional applications of DRS: rna/nanopore-drs/alternative-apps.md   
      - Epitranscriptomics: 
        - rna/epitranscriptomics/index.md 
      - Annotation: 
        - rna/annotation/index.md 
#I wonder if we should split Annotation. The first one can be tools that links to this page above, and
#then the second would be linking to the Table of all the herpes omics annotations

  - References:
      - references/index.md
      #- Glossary: reference/glossary.md
